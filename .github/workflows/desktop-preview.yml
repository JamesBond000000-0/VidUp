name: Avalonia Desktop Preview

on:
  pull_request:
    paths:
      - 'VidUp.Desktop/**'
      - 'VidUp.Desktop.Tests/**'
      - 'global.json'
      - '.github/workflows/desktop-preview.yml'
  push:
    branches: ['arena/989f0d91-vidup']
    paths:
      - 'VidUp.Desktop/**'
      - 'VidUp.Desktop.Tests/**'
      - 'global.json'
      - '.github/workflows/desktop-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build preview (including compiled XAML bindings)
        run: dotnet build VidUp.Desktop/VidUp.Desktop.csproj -c Release --nologo
      - name: Test preview state and safe file handling
        run: dotnet test VidUp.Desktop.Tests/VidUp.Desktop.Tests.csproj -c Release --nologo
      - name: Publish Windows preview (not an installer)
        if: runner.os == 'Windows'
        run: dotnet publish VidUp.Desktop/VidUp.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/desktop-preview
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: VidUp-Desktop-Preview-win-x64
          path: artifacts/desktop-preview
          retention-days: 7
